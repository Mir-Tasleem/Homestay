spring.application.name=homestay
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/homestay}
spring.datasource.username=${DATABASE_USERNAME:homestay}
spring.datasource.password=${DATABASE_PASSWORD:homestay_dev_password}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.error.include-message=never
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=PT1H
